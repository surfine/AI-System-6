name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: npm ci · build · feature tests · public tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the browser bundle
        run: npm run build
      - name: Feature tests
        run: npm test
      - name: Public tree verification
        run: npm run verify:public
