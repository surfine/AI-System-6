    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d6b1"/>
      <stop offset="0.45" stop-color="#d5ab72"/>
      <stop offset="1" stop-color="#94683a"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e6d0"/>
      <stop offset="1" stop-color="#cfb497"/>
    </linearGradient>
    <linearGradient id="g-gloss" x1="0" y1="0" x2="1" y2="1">
