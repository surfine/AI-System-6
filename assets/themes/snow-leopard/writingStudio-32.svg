  <path d="M9 4h14v10H9z" fill="url(#g-body)" stroke="#4d4d4d" stroke-width="1" />
    <path d="M5 13h22v12H5z" fill="url(#g-body)" stroke="#4d4d4d" stroke-width="1" />
    <path d="M4 25h24v3H4z" fill="url(#g-body)" stroke="#4d4d4d" stroke-width="1" />
  <g clip-path="url(#cp-body)">
