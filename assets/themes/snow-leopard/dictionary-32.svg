    <rect x="0" y="0" width="32" height="32" fill="url(#g-sh)"/>
    <rect x="1" y="0" width="30" height="1" fill="#ffffff" fill-opacity="0.55"/>
  </g>
  
  <path d="M10 5v22M13 11h8M13 16h7M13 21h8" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-linecap="square" />
  <path d="M21 5v5h4" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-linecap="square" />
