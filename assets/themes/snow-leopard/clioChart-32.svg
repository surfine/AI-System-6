  <path d="M9 6h17v5H9zM9 22h8v5H9z" fill="url(#g-body)" stroke="#4d4d4d" stroke-width="1" />
    <path d="M9 14h12v5H9z" fill="url(#g-body)" stroke="#4d4d4d" stroke-width="1" />
    <path d="M3 14l5 2.5L3 19z" fill="url(#g-body)" stroke="#4d4d4d" stroke-width="1" />
  <g clip-path="url(#cp-body)">
