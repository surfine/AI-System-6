<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <!-- Snow Leopard 10.6 painter (shared recipe): matte silver body, soft top
       highlight, gentle shade, quiet rim. Same anatomy, quieter generation. -->
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#e6e9ef"/>
      <stop offset="1" stop-color="#c7ceda"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafbfc"/>
      <stop offset="1" stop-color="#d7dbe4"/>
    </linearGradient>
    <linearGradient id="g-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="cp-body">
      <path d="M7 5h18v22H7z" />
      <path d="M20 23h4v3h-4z" />
    </clipPath>
  </defs>
  <path d="M7 5h18v22H7z" fill="url(#g-body)" stroke="#4d4d4d" stroke-width="1" />
    <path d="M20 23h4v3h-4z" fill="url(#g-body)" stroke="#4d4d4d" stroke-width="1" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="32" height="32" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="32" height="32" fill="url(#g-sh)"/>
    <rect x="1" y="0" width="30" height="1" fill="#ffffff" fill-opacity="0.55"/>
  </g>
  
  <path d="M12 9v15M9 10h14M9 15h14M9 20h10" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-linecap="square" />
</svg>
