      <stop offset="0" stop-color="#d0dff5"/>
      <stop offset="0.5" stop-color="#acc2e2"/>
      <stop offset="1" stop-color="#8ba0c4"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0eaf8"/>
      <stop offset="1" stop-color="#afbed5"/>
