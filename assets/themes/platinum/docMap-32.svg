<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Platinum painter (shared recipe) : AI System 6's own docMap silhouette.
       Dark rim, gradient volume, clipped highlight/shade, ink details.
       No Apple art. -->
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c6f0"/>
      <stop offset="0.5" stop-color="#6f98da"/>
      <stop offset="1" stop-color="#3f68ad"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0e0f7"/>
      <stop offset="0.5" stop-color="#b0c6eb"/>
      <stop offset="1" stop-color="#95acd2"/>
    </linearGradient>
    <linearGradient id="g-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="cp-body">
      <rect x="12" y="4" width="8" height="8"/>
      <rect x="4" y="20" width="8" height="8"/>
      <rect x="20" y="20" width="8" height="8"/>
    </clipPath>
  </defs>
  <rect x="12" y="4" width="8" height="8" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <rect x="4" y="20" width="8" height="8" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <rect x="20" y="20" width="8" height="8" fill="url(#g-body)" stroke="#111" stroke-width="1" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="32" height="32" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="32" height="32" fill="url(#g-sh)"/>
    <rect x="0" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="30" y="0" width="2" height="32" fill="#000000" fill-opacity="0.12"/>
  </g>
  <circle cx="16" cy="17" r="2" fill="#2a4167" stroke="#111" stroke-width="0.8" />
  <path d="M16 12v5M8 20l8-8 8 8" fill="none" stroke="#111" stroke-width="1" stroke-linecap="square" />
</svg>
