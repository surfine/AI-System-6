  <path d="M3 5h10v2h7v2h9v19H3z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <path d="M8 14h16v9H8z" fill="url(#g-soft)" stroke="#111" stroke-width="1" />
  <g clip-path="url(#cp-body)">
