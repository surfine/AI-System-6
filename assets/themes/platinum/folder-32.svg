      <stop offset="1" stop-color="#5f5fd0"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f1fd"/>
      <stop offset="0.5" stop-color="#e2e5fa"/>
      <stop offset="1" stop-color="#c6cbf0"/>
