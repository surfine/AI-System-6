<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Platinum painter (shared recipe) : AI System 6's own endfieldTerminal silhouette.
       Black keyline, white highlight, subtle bevel, pixel-crisp edges,
       material palette, restrained shading. No Apple art. -->
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#404854"/>
      <stop offset="0.5" stop-color="#2c323c"/>
      <stop offset="1" stop-color="#1c1e26"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#969aa1"/>
      <stop offset="0.5" stop-color="#8b8e94"/>
      <stop offset="1" stop-color="#828388"/>
    </linearGradient>
    <linearGradient id="g-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
