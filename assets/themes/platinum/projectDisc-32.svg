  </defs>
  <path d="M13 25h8v4h-8z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <path d="M11 22h10v7H11zM14 27h4" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <circle cx="16" cy="15" r="11" fill="url(#g-soft)" stroke="#111" stroke-width="1" />
  <g clip-path="url(#cp-body)">
