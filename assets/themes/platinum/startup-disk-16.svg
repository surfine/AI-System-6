<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Platinum painter (shared recipe) : approved reference painter startupDisk.
       Black keyline, white highlight, subtle bevel, pixel-crisp edges,
       material palette, restrained shading. No Apple art. -->
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f4"/>
      <stop offset="0.5" stop-color="#dedee2"/>
      <stop offset="1" stop-color="#b0b0ba"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c0ec"/>
      <stop offset="0.5" stop-color="#7090d4"/>
      <stop offset="1" stop-color="#4060a8"/>
    </linearGradient>
    <linearGradient id="g-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="cp-body">
      <path d="M2 2h10v1h2v11H2z" />
      <path d="M4 5h7v5H4z" />
    </clipPath>
  </defs>
  <path d="M2 2h10v1h2v11H2z" fill="url(#g-body)" stroke="#111" stroke-width="0.8" />
    <path d="M4 5h7v5H4z" fill="url(#g-soft)" stroke="#111" stroke-width="0.8" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="16" height="16" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="16" height="16" fill="url(#g-sh)"/>
    <rect x="0" y="0" width="1" height="16" fill="#ffffff" fill-opacity="0.32"/>
    <rect x="0" y="0" width="16" height="1" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="15" y="0" width="1" height="16" fill="#000000" fill-opacity="0.2"/>
    <rect x="0" y="15" width="16" height="1" fill="#000000" fill-opacity="0.16"/>
  </g>
  <path d="M4 11h8v1H4z" fill="#1c1c24" stroke="#111" stroke-width="0.6" />
  
</svg>
