<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Platinum painter (shared recipe) : AI System 6's own soundscape silhouette.
       Dark rim, gradient volume, clipped highlight/shade, ink details.
       No Apple art. -->
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b6e8"/>
      <stop offset="0.5" stop-color="#9a7fd4"/>
      <stop offset="1" stop-color="#684fa8"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1d7f2"/>
      <stop offset="0.5" stop-color="#c7b9e7"/>
      <stop offset="1" stop-color="#ac9ecf"/>
    </linearGradient>
    <linearGradient id="g-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="cp-body">
      <path d="M5 6h22v20H5z" />
    </clipPath>
  </defs>
  <path d="M5 6h22v20H5z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="32" height="32" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="32" height="32" fill="url(#g-sh)"/>
    <rect x="0" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="30" y="0" width="2" height="32" fill="#000000" fill-opacity="0.12"/>
  </g>
  
  <path d="M8 16h3l2-6 3 12 3-10 2 7h3" fill="none" stroke="#111" stroke-width="1" stroke-linecap="square" />
  <path d="M8 24c3-3 5-3 8 0s5 3 8 0" fill="none" stroke="#111" stroke-width="1" stroke-linecap="square" />
</svg>
