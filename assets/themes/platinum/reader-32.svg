  </defs>
  <path d="M5 7h10c2 0 3 1 3 3v17c0-2-1-3-3-3H5z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <path d="M27 7H17c-2 0-3 1-3 3v17c0-2 1-3 3-3h10z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="32" height="32" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="32" height="32" fill="url(#g-sh)"/>
    <rect x="0" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.32"/>
