<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Platinum painter (shared recipe) : AI System 6's own chooser silhouette.
       Dark rim, gradient volume, clipped highlight/shade, ink details.
       No Apple art. -->
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5c4f0"/>
      <stop offset="0.5" stop-color="#6c96dc"/>
      <stop offset="1" stop-color="#3d66b4"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cedff7"/>
      <stop offset="0.5" stop-color="#aec5ec"/>
      <stop offset="1" stop-color="#94abd6"/>
    </linearGradient>
    <linearGradient id="g-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="cp-body">
      <path d="M5 7h22v18H5z" />
      <rect x="7" y="10" width="5" height="5"/>
      <rect x="17" y="15" width="5" height="5"/>
    </clipPath>
  </defs>
  <path d="M5 7h22v18H5z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <rect x="7" y="10" width="5" height="5" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <rect x="17" y="15" width="5" height="5" fill="url(#g-body)" stroke="#111" stroke-width="1" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="32" height="32" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="32" height="32" fill="url(#g-sh)"/>
    <rect x="0" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="30" y="0" width="2" height="32" fill="#000000" fill-opacity="0.12"/>
  </g>
  
  <path d="M9 12h14M9 17h14M9 22h14" fill="none" stroke="#111" stroke-width="1" stroke-linecap="square" />
  <path d="M13 9v16M19 9v16" fill="none" stroke="#111" stroke-width="1" stroke-linecap="square" />
