<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Platinum painter (shared recipe) : AI System 6's own searcher silhouette.
       Black keyline, white highlight, subtle bevel, pixel-crisp edges,
       material palette, restrained shading. No Apple art. -->
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9cdef"/>
      <stop offset="0.5" stop-color="#7fa4dd"/>
      <stop offset="1" stop-color="#4574b8"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d4f5"/>
      <stop offset="0.5" stop-color="#78a8e4"/>
      <stop offset="1" stop-color="#4078c0"/>
    </linearGradient>
    <linearGradient id="g-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="cp-body">
      <circle cx="13" cy="13" r="7"/>
    </clipPath>
  </defs>
  <circle cx="13" cy="13" r="7" fill="url(#g-soft)" stroke="#111" stroke-width="1" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="32" height="32" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="32" height="32" fill="url(#g-sh)"/>
    <rect x="0" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.32"/>
    <rect x="0" y="0" width="32" height="2" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="30" y="0" width="2" height="32" fill="#000000" fill-opacity="0.2"/>
    <rect x="0" y="30" width="32" height="2" fill="#000000" fill-opacity="0.16"/>
  </g>
  
  <path d="M18 18l8 8" fill="none" stroke="#111" stroke-width="1" stroke-linecap="square" />
  <path d="M10 13h6M13 10v6" fill="none" stroke="#111" stroke-width="1" stroke-linecap="square" />
  <path d="M5 25c5-4 10-4 16-1" fill="none" stroke="#111" stroke-width="1" stroke-linecap="square" />
</svg>
