      <path d="M5 13h22v12H5z" />
      <path d="M4 25h24v3H4z" />
    </clipPath>
  </defs>
  <path d="M9 4h14v10H9z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <path d="M5 13h22v12H5z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
    <path d="M4 25h24v3H4z" fill="url(#g-body)" stroke="#111" stroke-width="1" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="32" height="32" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="32" height="32" fill="url(#g-sh)"/>
    <rect x="0" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.32"/>
    <rect x="0" y="0" width="32" height="2" fill="#ffffff" fill-opacity="0.24"/>
    <rect x="30" y="0" width="2" height="32" fill="#000000" fill-opacity="0.2"/>
