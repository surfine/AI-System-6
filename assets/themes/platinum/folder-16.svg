<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Platinum painter (shared recipe) : approved reference painter folder.
       Dark rim, gradient volume, clipped highlight/shade, ink details.
       No Apple art. -->
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7c9ef"/>
      <stop offset="0.5" stop-color="#9999ff"/>
      <stop offset="1" stop-color="#5f5fd0"/>
    </linearGradient>
    <linearGradient id="g-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f1fd"/>
      <stop offset="0.5" stop-color="#e2e5fa"/>
      <stop offset="1" stop-color="#c6cbf0"/>
    </linearGradient>
    <linearGradient id="g-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="cp-body">
      <path d="M2 4h4v1h3v1h5v8H2z" />
      <path d="M4 8h8v4H4z" />
    </clipPath>
  </defs>
  <path d="M2 4h4v1h3v1h5v8H2z" fill="url(#g-body)" stroke="#111" stroke-width="0.8" />
    <path d="M4 8h8v4H4z" fill="url(#g-soft)" stroke="#111" stroke-width="0.8" />
  <g clip-path="url(#cp-body)">
    <rect x="0" y="0" width="16" height="16" fill="url(#g-hi)"/>
    <rect x="0" y="0" width="16" height="16" fill="url(#g-sh)"/>
    <rect x="0" y="0" width="1" height="16" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="15" y="0" width="1" height="16" fill="#000000" fill-opacity="0.12"/>
  </g>
  <path d="M2 12h1v3H2zM13 11h1v4h-1zM2 15h12v1H2z" fill="#333399" stroke="#111" stroke-width="0.6" />
  
</svg>
