<h1>春天的码头</h1>
<p>春天来得比往年早，河边的柳树已经冒出新芽。我们沿着老街一路走到码头，看见渔船陆续靠岸，船工把一筐筐鱼抬上石阶。</p>
<p>街角那家开了三十年的面馆照旧排着队，老板说今年面粉涨价，但他不打算提价。回去的路上下起小雨，雨水顺着瓦檐落在青石板上。</p>
