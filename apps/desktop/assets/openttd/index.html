<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OpenTTD</title>
<style>
  /* Standalone shell page: it runs inside an iframe of AI System 6 and must
     not depend on the desktop bundles. Minimal 1-bit System 6 look. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #game-root {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas.emscripten {
    display: block;
    /* Emscripten writes a fixed pixel size into the element style every
       time the game surface changes; between a window resize and the next
       surface update that fixed size leaves black bars around the game.
       The page-level override keeps the canvas glued to the pane, and the
       shell resizes the backing store to match (em_openttd_set_resolution),
       so the picture stays 1:1 once the surface settles. */
    width: 100% !important;
    height: 100% !important;
    image-rendering: pixelated;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
    background: #000;
  }
  #boot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #bfbfbf;
    background-image: repeating-conic-gradient(#fff 0% 25%, #bfbfbf 0% 50%);
    background-size: 2px 2px;
    z-index: 10;
  }
  #boot.is-hidden { display: none; }
  .boot-card {
    background: #fff;
    border: 2px solid #000;
    box-shadow: 2px 2px 0 #000;
    padding: 18px 24px;
    max-width: 320px;
    text-align: center;
    font-family: "Chicago", "Charcoal", "Geneva", "Songti SC", "SimSun", monospace;
    color: #000;
  }
  .boot-card h1 { font-size: 16px; margin: 0 0 10px; font-weight: bold; }
  .boot-card p { font-size: 12px; margin: 6px 0; line-height: 1.5; }
  .boot-progress {
    height: 12px;
    border: 1px solid #000;
    margin-top: 12px;
    background: #fff;
    overflow: hidden;
  }
  .boot-progress > div {
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(90deg, #000 0 2px, #fff 2px 4px);
    transition: width 0.2s;
  }
  .boot-error h1 { text-decoration: underline; }
  #rotate-hint {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    max-width: 90%;
    background: #fff;
    border: 2px solid #000;
    box-shadow: 2px 2px 0 #000;
    padding: 8px 14px;
    font-family: "Chicago", "Charcoal", "Geneva", "Songti SC", "SimSun", monospace;
    font-size: 13px;
    color: #000;
    z-index: 20;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="game-root">
    <canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
  </div>
  <div id="boot">
    <div class="boot-card" id="boot-card">
      <h1 id="boot-title">OpenTTD</h1>
      <p id="boot-message">正在装载运输大亨……</p>
      <div class="boot-progress"><div id="boot-bar"></div></div>
    </div>
  </div>

<script src="shell.js"></script>
<script src="openttd.js"></script>
</body>
</html>
