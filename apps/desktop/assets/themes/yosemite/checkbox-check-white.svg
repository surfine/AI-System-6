<?xml version="1.0" encoding="UTF-8"?>
<svg width="12" height="12" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Two-stroke white check scaled from the Yosemite-gtk-theme
       checkbox-checked.png asset (16px frame, ~8px check, 2px stroke).

       The previous path, M11.6 5.4 8 9.5 5.4 11.9, was not a checkmark: all
       three points descend leftward, so it drew one straight slash with no
       vertex — the same defect the Snow Leopard mark carried before it was
       refitted. A check needs the vertex at the bottom, a short arm rising to
       the upper left and a longer arm rising to the upper right.

       The geometry is fitted, not estimated: the reference asset's glyph mask
       was read out of the 2x fidelity tile (vertex at 13,19; short-arm start at
       8,14; long-arm tip at 22,9 in the 30px tile) and divided back into this
       16-unit viewBox. -->
  <path d="M5.4 8.45 8.05 11.1 12.85 5.75" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
