<!-- resize-grip: pixel-derived from the 10.2 Open dialog lower-right corner:
     a subtle gray wedge with two short diagonal grip lines, no square frame. -->
<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15">
  <defs>
    <linearGradient id="wedge" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#f6f6f6"/>
      <stop offset="0.55" stop-color="#dedede"/>
      <stop offset="1" stop-color="#c9c9c9"/>
    </linearGradient>
  </defs>
  <path d="M0 15 L15 0 L15 15 Z" fill="url(#wedge)"/>
  <path d="M5 15 L15 5 M9 15 L15 9" stroke="#a0a0a0" stroke-width="1" fill="none"/>
</svg>
