<!-- Big Sur pop-up arrow well in the key window, measured from the macOS 11 Mail Preferences capture (512 Pixels, 11-Big-Sur-Mail-Preferences.png, 2x): a 16x16pt rounded square inset 2pt from the button's right end, filled top #3e7ff6 to bottom #226af6, with white up-and-down chevrons. Background windows and disabled pop-ups drop the well (popup-chevrons-*.svg). Measured reconstruction at 1x. -->
