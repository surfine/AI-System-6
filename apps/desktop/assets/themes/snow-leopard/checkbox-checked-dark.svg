<?xml version="1.0" encoding="UTF-8"?>
<svg width="14" height="14" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
  <!-- The 10.6 check, drawn from the capture's own pixels: Quaqua 9.1
       CheckBox.icons.png frame 2, the blue checked well. The 2026-09-19
       fidelity run measured this mark against that frame's glyph mask and
       found the path this file carried sat one pixel left of the capture,
       with a round cap that made the tip two pixels wide where the capture
       draws one: markMismatch 0.545 against the specimen's 0.375 ceiling. The
       three points below put the vertex and both arm ends on the capture's
       mask, and the butt cap is what keeps the tip at the capture's width.
       The arm reaches the well's top edge and stops there, because a
       background image is clipped to its control. -->
  <path d="M4.6 4.4 7.8 9.2 11.9 1.2" fill="none" stroke="#101010" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round"/>
</svg>
